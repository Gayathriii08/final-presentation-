<div class="opportunity-detail-container">
  <div class="opportunity-detail-content">
    <h1>{{ opportunity.title }}</h1>
    <p>{{ opportunity.description }}</p>
    <p><strong>Category:</strong> {{ opportunity.category }}</p>

    <app-confirm-modal></app-confirm-modal>
  </div>

  <aside class="opportunity-detail-aside">
    <div class="aside-card">
      <h3>Opportunity Info</h3>
      <div class="meta-row"><strong>Location:</strong> {{ opportunity.location || 'N/A' }}</div>
      <div class="meta-row"><strong>Date:</strong> {{ opportunity.date || 'N/A' }}</div>
      <div class="meta-row"><strong>Duration:</strong> {{ opportunity.duration || 'N/A' }}</div>
      <div class="meta-row"><strong>Status:</strong> {{ opportunity.status || 'N/A' }}</div>

      <div class="action-row">
        <button class="btn-primary" (click)="applyToOpportunity()">Apply</button>
      </div>
    </div>
  </aside>
</div>
